name: Call Reusable Workflow

on:
  push:
    branches: [main]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  call-flutter-workflow:
    uses: Darryl-Cardoza/reusable-repo-flutter/.github/workflows/push.yml@main
    with:
      build_ios: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}


  call-release:
    needs: call-flutter-workflow
    uses: Darryl-Cardoza/reusable-repo-flutter/.github/workflows/release.yml@main
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}