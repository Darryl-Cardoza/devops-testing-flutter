# .github/workflows/ci-cd-caller.yml
# Main workflow for Flutter CI/CD
# Orchestrates reusable CI (push.yml) and CD (release.yml)

name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write          # Required for GitHub Releases
  pull-requests: read
  actions: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # Extract app version from pubspec.yaml
  # ---------------------------------------------------------------------------
  extract-version:
    name: Extract App Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: version
        run: |
          # Example: version: 1.0.0+12 → 1.0.0
          version_string=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=${version_string}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${version_string}"

  # ---------------------------------------------------------------------------
  # Call reusable CI workflow (tests, analysis, build)
  # Runs on PRs and pushes
  # ---------------------------------------------------------------------------
  call-ci-workflow:
    name: Call Reusable CI Workflow
    needs: extract-version
    uses: Darryl-Cardoza/flutter-reusable-repo/.github/workflows/push.yml@main

    with:

      flutter_version: ${{ vars.FLUTTER_VERSION }}
      flutter_channel: ${{ vars.FLUTTER_CHANNEL }}
      coverage_threshold: ${{ vars.COVERAGE_THRESHOLD }}
      build_ios: ${{ vars.BUILD_IOS == 'true' }}

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ALIAS }}

  # ---------------------------------------------------------------------------
  # Call reusable CD workflow
  #
  # ---------------------------------------------------------------------------
  call-cd-workflow:
    name: Call Reusable CD Workflow
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [extract-version, call-ci-workflow]
    uses: Darryl-Cardoza/flutter-reusable-repo/.github/workflows/release.yml@main

    with:
      version: ${{ needs.extract-version.outputs.version }}

      # Cloud / Infra (disabled)
      deploy_to_cloud: false
      enable_aws: false

      # Play Store
      deploy_to_playstore: true
      playstore_track: internal
      playstore_status: draft
      package_name: com.devops.test

    secrets:
      PLAYSTORE_SERVICE_ACCOUNT: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT }}
