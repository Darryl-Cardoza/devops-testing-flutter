# .github/workflows/ci-cd-caller.yml
# This is the main workflow in your app's repository.
# It calls the reusable CI and CD workflows based on the event trigger.

name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write # Needed for creating GitHub releases
  pull-requests: read
  actions: read
  security-events: write

jobs:
  # This job extracts the app version from pubspec.yaml to use in other jobs.
  extract-version:
    name: Extract App Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: version
        run: |
          # Extracts version like "1.0.0" from "version: 1.0.0+1"
          version_string=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=${version_string}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${version_string}"

  # This job calls the reusable CI workflow.
  # It runs on every push to main and on every pull request targeting main.
  call-ci-workflow:
    name: Call Reusable Release Workflow
    needs: extract-version
    uses: Darryl-Cardoza/flutter-reusable-repo/.github/workflows/push.yml@main

    with:
      flutter_version: ${{ vars.FLUTTER_VERSION || '3.32.0' }} # Use repo variable or a default
      flutter_channel: ${{ vars.FLUTTER_CHANNEL || 'stable' }}
      coverage_threshold: ${{ vars.COVERAGE_THRESHOLD || '80' }}
      build_ios: ${{ vars.BUILD_IOS == 'true' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}


  # This job calls the reusable CD workflow.
  # It ONLY runs on a push to the main branch, ensuring releases are controlled.
  call-cd-workflow:
    name: Call Reusable CD Workflow
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [extract-version, call-ci-workflow]
    uses: Darryl-Cardoza/flutter-reusable-repo/.github/workflows/release.yml@main
    with:
      version: ${{ needs.extract-version.outputs.version }}
      deploy_to_cloud: true
      enable_aws: true
      terraform_working_dir: './terraform'
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}