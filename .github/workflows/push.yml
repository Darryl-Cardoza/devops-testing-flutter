name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read
  actions: read
  security-events: write

env:
  PACKAGE_NAME: com.devops.test

jobs:
  # ---------------------------------------------------------------------------
  # Extract app version from pubspec.yaml
  # ---------------------------------------------------------------------------
  extract-version:
    name: Extract App Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Extract Version from pubspec.yaml
        id: version
        run: |
          # Example: version: 1.0.0+12 → 1.0.0
          version_string=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=${version_string}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${version_string}"

  # ---------------------------------------------------------------------------
  # Call reusable CI workflow (tests, analysis, build)
  # ---------------------------------------------------------------------------
  call-ci-workflow:
    name: Call Reusable CI Workflow
    needs: extract-version
    uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/workflows/push.yml@main

    with:
      flutter_version: ${{ vars.FLUTTER_VERSION }}
      flutter_channel: ${{ vars.FLUTTER_CHANNEL }}
      coverage_threshold: ${{ vars.COVERAGE_THRESHOLD }}
      build_android: false
      build_ios: ${{ vars.BUILD_IOS == 'true' }}
      package_name: com.devops.test
      ios_bundle_id: app.devops.test
      version_name: ${{ needs.extract-version.outputs.version }}

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  # ---------------------------------------------------------------------------
  # Call reusable CD workflow
  # ---------------------------------------------------------------------------
  call-cd-workflow:
    name: Call Reusable CD Workflow
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ extract-version, call-ci-workflow ]
    uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/workflows/release.yml@main

    with:
      # GitHub Release version
      version: ${{ needs.extract-version.outputs.version }}

      # Cloud / Infra
      deploy_to_cloud: false
      enable_aws: false

      # Play Store (Android)
      deploy_to_playstore: false
      playstore_track: internal
      playstore_status: draft
      package_name: com.devops.test

      # iOS / TestFlight
      deploy_to_testflight: false
      ios_bundle_id: app.devops.test

      build_number: ${{ github.run_number }}
      enable_whats_new: true
      whats_new_file: release_notes/${{ needs.extract-version.outputs.version }}.txt

      # Esper
      deploy_to_esper_android: false
      deploy_to_esper_ios: true
      esper_org_id: ${{ vars.ESPER_ORG_ID }}
      esper_tenant: ${{ vars.ESPER_TENANT }}

    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ALIAS }}
      PLAYSTORE_SERVICE_ACCOUNT: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT }}

      # If/when you enable TestFlight, uncomment these:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      IOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}

      ESPER_API_KEY: ${{ secrets.ESPER_API_KEY }}



