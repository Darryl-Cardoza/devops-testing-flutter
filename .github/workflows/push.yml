name: Call Reusable Workflow

on:
  push:
    branches: [main]

jobs:
  call-flutter-workflow:
    uses: Darryl-Cardoza/reusable-repo-flutter/.github/workflows/push.yml@main
    with:
      build_ios: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}